name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Self test (parsers and versioning)
        run: .build/release/MycSs --selftest-pure | tee selftest.log
      - name: Fail on a failed check
        run: "! grep -E '!! FAIL' selftest.log"
