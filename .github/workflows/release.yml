name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build the disk image
        run: ./scripts/make-dmg.sh
      - name: Release notes from the changelog
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          python3 scripts/changelog.py notes "$V" > notes.md
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MycSs-*.dmg
            dist/MycSs-*.dmg.sha256
          generate_release_notes: false
          body_path: notes.md

  cask:
    needs: dmg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the Homebrew cask at the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" --pattern "MycSs-${V}.dmg.sha256" --dir .
          SHA="$(cut -d' ' -f1 "MycSs-${V}.dmg.sha256")"
          sed -i -E "s/^  version \".*\"/  version \"${V}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/mycss.rb
          rm -f "MycSs-${V}.dmg.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mycss.rb
          git diff --cached --quiet || git commit -m "chore(cask): mycss ${V}"
          git push origin main
